url: "https://fr.wikipedia.org/wiki/Liste_des_pays_par_population"

pagination:
  pattern: null
  start: 1
  max_pages: 1

selectors:
  titre: "table.wikitable tbody tr td:nth-child(2)"
  url: "table.wikitable tbody tr td:nth-child(2) a"
  population: "table.wikitable tbody tr td:nth-child(3)"

fetcher:
  delay: 1.5
  retries: 3
  timeout: 15
  user_agent: "DataHarvest/1.0 (+contact@ipssi.fr)"

store:
  backend: json
  path: "output/wikipedia_population.json"