url: https://books.toscrape.com/
pagination:
  pattern: /catalogue/page-{n}.html
  start: 1
  max_pages: 5
selectors:
  titre: h3 a
  url: h3 a
  prix: .price_color
  disponibilite: .availability
fetcher:
  delay: 1.0
  retries: 3
  timeout: 15
  user_agent: "DataHarvest/1.0 (+contact@ipssi.fr)"
store:
  backend: sqlite
  path: output/books_toscrape.db
