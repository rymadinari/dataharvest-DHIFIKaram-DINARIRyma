url: https://www.blogdumoderateur.com/web/
pagination:
  pattern: null
  start: 1
  max_pages: 1
selectors:
  url: header.entry-header a
  titre: h3.entry-title
  date: time.entry-date
  categorie: span.favtag
fetcher:
  delay: 1.5
  retries: 3
  timeout: 15
  user_agent: "DataHarvest/1.0 (+contact@ipssi.fr)"
store:
  backend: sqlite
  path: output/blogdumoderateur.db